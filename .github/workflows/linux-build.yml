name: AFIF-PBX Linux build (compile check)

on:
  workflow_dispatch:
  push:
    branches: [linux-port]
    paths:
      - "native/src/**"
      - "native/tests/**"
      - ".github/workflows/linux-build.yml"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-arm, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish native/src/AfifPbx.Server/AfifPbx.Server.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:Version=2.0.0 -p:DebugType=none -o "out/${{ matrix.rid }}"
          find "out/${{ matrix.rid }}" -maxdepth 1 -type f | head -20
