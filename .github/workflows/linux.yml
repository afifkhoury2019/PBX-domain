name: AFIF-PBX Linux ARM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/linux.yml"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Build afif-net for the test host
        working-directory: native/afif-net
        run: |
          set -o pipefail
          go mod tidy
          go build -trimpath -o "$RUNNER_TEMP/afif-net" .
          echo "AFIF_NET_PATH=$RUNNER_TEMP/afif-net" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build native/tests/AfifPbx.Tests/AfifPbx.Tests.csproj -c Release
      - name: Test
        run: |
          dotnet test native/tests/AfifPbx.Tests/AfifPbx.Tests.csproj -c Release --no-build \
            --logger "console;verbosity=normal" --blame-hang-timeout 3m

  publish:
    name: Publish ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-arm
            goarch: arm
            goarm: "7"
            name: armhf
          - rid: linux-arm64
            goarch: arm64
            goarm: ""
            name: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Cross-build afif-net
        working-directory: native/afif-net
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          go mod tidy
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/afif-net" .
          file "$RUNNER_TEMP/afif-net"
      - name: Publish the server
        run: |
          dotnet publish native/src/AfifPbx.Server/AfifPbx.Server.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:Version=2.0.0 -p:DebugType=none -o "out/${{ matrix.name }}"
          cp "$RUNNER_TEMP/afif-net" "out/${{ matrix.name }}/afif-net"
          chmod +x "out/${{ matrix.name }}/afif-net"
          tar -C "out/${{ matrix.name }}" -czf "afif-pbx-linux-${{ matrix.name }}.tar.gz" .
          ls -lh "afif-pbx-linux-${{ matrix.name }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: afif-pbx-linux-${{ matrix.name }}
          path: afif-pbx-linux-${{ matrix.name }}.tar.gz
