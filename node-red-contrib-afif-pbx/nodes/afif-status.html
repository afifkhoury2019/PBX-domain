<script type="text/html" data-template-name="afif-status">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="AFIF status">
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> AFIF-PBX</label>
    <input type="text" id="node-input-config">
  </div>
  <div class="form-row">
    <label for="node-input-poll"><i class="fa fa-clock-o"></i> Poll every</label>
    <input type="number" id="node-input-poll" min="2" placeholder="30"> seconds
  </div>
  <div class="form-row">
    <label>&nbsp;</label>
    <input type="checkbox" id="node-input-onlyChanges" style="display:inline-block;width:auto;vertical-align:top;">
    <label for="node-input-onlyChanges" style="width:70%;display:inline-block;">Only send when the status changes</label>
  </div>
</script>

<script type="text/html" data-help-name="afif-status">
  <p>Emits the AFIF-PBX status: GSM modem, SIP addresses, registered extensions, active calls,
  voicemail count and recent activity. The full object is in <code>msg.payload</code>.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("afif-status", {
    category: "AFIF-PBX",
    color: "#1a2648",
    defaults: {
      name: { value: "" },
      config: { type: "afif-pbx-config", required: true },
      poll: { value: 30, validate: RED.validators.number() },
      onlyChanges: { value: true }
    },
    inputs: 0,
    outputs: 1,
    icon: "font-awesome/fa-signal",
    label: function () {
      return this.name || "AFIF status";
    }
  });
</script>
