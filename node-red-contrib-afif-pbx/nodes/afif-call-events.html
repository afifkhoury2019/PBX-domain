<script type="text/html" data-template-name="afif-call-events">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="AFIF call events">
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> AFIF-PBX</label>
    <input type="text" id="node-input-config">
  </div>
  <div class="form-row">
    <label for="node-input-poll"><i class="fa fa-clock-o"></i> Poll every</label>
    <input type="number" id="node-input-poll" min="2" placeholder="10"> seconds
  </div>
  <div class="form-row">
    <label>&nbsp;</label>
    <input type="checkbox" id="node-input-initial" style="display:inline-block;width:auto;vertical-align:top;">
    <label for="node-input-initial" style="width:70%;display:inline-block;">Send existing calls on start</label>
  </div>
</script>

<script type="text/html" data-help-name="afif-call-events">
  <p>Emits new call records from the AFIF-PBX call log. <code>msg.payload</code> is the full
  call, <code>msg.event</code> is one of <code>answered</code>, <code>missed</code>,
  <code>busy</code>, <code>failed</code>, <code>voicemail</code>, and the caller/callee are in
  <code>msg.from</code> and <code>msg.to</code>.</p>
  <p>The node polls the panel's call log and keeps the highest call id it has seen.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("afif-call-events", {
    category: "AFIF-PBX",
    color: "#1a2648",
    defaults: {
      name: { value: "" },
      config: { type: "afif-pbx-config", required: true },
      poll: { value: 10, validate: RED.validators.number() },
      initial: { value: false }
    },
    inputs: 0,
    outputs: 1,
    icon: "font-awesome/fa-phone",
    label: function () {
      return this.name || "AFIF call events";
    }
  });
</script>
