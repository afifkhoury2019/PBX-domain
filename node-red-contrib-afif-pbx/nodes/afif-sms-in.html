<script type="text/html" data-template-name="afif-sms-in">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="AFIF SMS in">
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> AFIF-PBX</label>
    <input type="text" id="node-input-config">
  </div>
  <div class="form-row">
    <label for="node-input-poll"><i class="fa fa-clock-o"></i> Poll every</label>
    <input type="number" id="node-input-poll" min="2" placeholder="15"> seconds
  </div>
  <div class="form-row">
    <label>&nbsp;</label>
    <input type="checkbox" id="node-input-initial" style="display:inline-block;width:auto;vertical-align:top;">
    <label for="node-input-initial" style="width:70%;display:inline-block;">Send existing SMS on start</label>
  </div>
</script>

<script type="text/html" data-help-name="afif-sms-in">
  <p>Emits every new SMS received by AFIF-PBX. The message is in <code>msg.payload</code>,
  the remote number in <code>msg.topic</code>/<code>msg.to</code>, and the full record in
  <code>msg.sms</code>.</p>
  <p>The panel API is polled; the node keeps the highest SMS id it has seen so it does not
  emit the same message twice.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("afif-sms-in", {
    category: "AFIF-PBX",
    color: "#1a2648",
    defaults: {
      name: { value: "" },
      config: { type: "afif-pbx-config", required: true },
      poll: { value: 15, validate: RED.validators.number() },
      initial: { value: false }
    },
    inputs: 0,
    outputs: 1,
    icon: "font-awesome/fa-envelope",
    label: function () {
      return this.name || "AFIF SMS in";
    }
  });
</script>
